wtf:
  colors:
    border:
      focusable: darkslateblue
      focused: orange
      normal: gray
  grid:
    columns: [32, 32, 32, 32, 90]
    rows: [10, 10, 10, 4, 4, 90]
  refreshInterval: 1
  mods:

    clocks_a:
      colors:
        rows:
          even: "lightblue"
          odd: "white"
      enabled: true
      locations:
        Vancouver: "America/Vancouver"
        Toronto: "America/Toronto"
      position:
        top: 1
        left: 3
        height: 1
        width: 1
      refreshInterval: 15
      sort: "chronological"
      title: "Americas"
      type: "clocks"

    clocks_b:
      colors:
        rows:
          even: "lightblue"
          odd: "white"
      enabled: true
      locations:
        London: "Etc/UTC"
        Paris: "Europe/Paris"
        Bucharest: "Europe/Bucharest"
        India: "Asia/Kolkata"
      position:
        top: 2
        left: 3
        height: 1
        width: 1
      refreshInterval: 15
      sort: "chronological"
      title: "APAC"
      type: "clocks"

    digitalclock:
      color: orange
      enabled: true
      font: bigfont
      withDatePrefix: false
      hourFormat: 24
      position:
        top: 0
        left: 3
        height: 1
        width: 1
      refreshInterval: 1s
      type: "digitalclock"
      title: ""

    ipinfo:
      colors:
        name: "lightblue"
        value: "white"
      enabled: true
      position:
        top: 0
        left: 0
        height: 1
        width: 2
      refreshInterval: 150

    resourceusage:
      cpuCombined: false
      enabled: true
      position:
        top: 2
        left: 0
        height: 3
        width: 2
      refreshInterval: 1s
      showCPU: true
      showMem: true
      showSwp: true

    prettyweather:
      enabled: true
      city: "Waterloo, ON"
      position:
        top: 0
        left: 2
        height: 1
        width: 1
      refreshInterval: 5m
      unit: "m"
      view: 0
      language: "en"

    feedreader:
      enabled: true
      feeds:
      - https://news.ycombinator.com/rss
      - https://lobste.rs/rss
      feedLimit: 10
      position:
        top: 1
        left: 0
        height: 1
        width: 3
      refreshInterval: 4h
